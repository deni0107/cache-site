<style>
  :root { --bg:#f7f5f1; --ink:#1c1b19; --muted:#6b6862; --card:#fff; --line:#e4e0d8; --accent:#c4572e; --on-accent:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151412; --ink:#f2efe9; --muted:#a19d95; --card:#211f1c; --line:#34312c; --accent:#e27a50; --on-accent:#1c1b19; }
  }
  * { box-sizing:border-box; }
  html, body { overscroll-behavior:none; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding:max(28px, env(safe-area-inset-top)) 20px 140px; -webkit-text-size-adjust:100%; }
  main { max-width:440px; margin:0 auto; }
  img { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:14px; }
  h1 { font:500 26px/1.2 ui-serif, Georgia, serif; margin:16px 0 6px; }
  .price { font-size:19px; margin:0 0 6px; }
  p.lede { color:var(--muted); margin:0 0 24px; }
  .steps { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .steps b { font-weight:600; }
  .hint { margin:10px 0 0; color:var(--muted); font-size:15px; }
  .back { margin:20px 0 0; color:var(--muted); }
  .back a { color:var(--accent); font-weight:600; text-decoration:none; }
  .pointer { position:fixed; z-index:10; bottom:2px; right:22px; display:flex; flex-direction:column;
    align-items:flex-end; gap:2px; pointer-events:none; }
  .pointer[hidden] { display:none; }
  .pointer .label { background:var(--accent); color:var(--on-accent); font-size:14px; font-weight:600;
    padding:5px 11px; border-radius:999px; white-space:nowrap; box-shadow:0 2px 10px rgba(0,0,0,.18); }
  .pointer svg { width:34px; height:48px; color:var(--accent); display:block; margin-right:12px; }
  .pointer .bob { animation:bob 1.1s ease-in-out infinite; display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
  @keyframes bob { 0%,100% { transform:translateY(-6px); } 50% { transform:translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { .pointer .bob { animation:none; } }
</style>

<main>

  <h1>Apple AirPods Max</h1>

  <div class="steps">Tap <b>⋯</b>, then <b>Share</b>, then <b>Caché</b>.
    <p class="hint">Not in the row of apps? Scroll it to <b>More</b> and add Caché.</p>
  </div>
  <p class="back">Saved it? <a href="cache-bookmarks-7f4d9a://onboarding">Back to Caché</a></p>
</main>

<div class="pointer" id="pointer" hidden aria-hidden="true">
  <div class="bob">
    <span class="label">Tap ⋯</span>
    <svg viewBox="0 0 34 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3v40M5 31l12 12 12-12"/></svg>
  </div>
</div>

<script>
(() => {
  // Only Safari's compact layout (iOS 26, portrait iPhone) keeps ⋯ at the
  // bottom right, where the pointer aims. Elsewhere the words do the work.
  // Measured like safari.html: compact leaves about 145pt of browser chrome.
  const ua = navigator.userAgent;
  const iPad = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const version = parseInt((ua.match(/Version\/(\d+)/) || [])[1] || "0", 10);
  const portrait = innerHeight > innerWidth;
  const chrome = Math.max(screen.width, screen.height) - innerHeight;
  document.getElementById("pointer").hidden = iPad || !portrait || version < 26 || chrome >= 175;
})();
</script>
</body>
</html>
